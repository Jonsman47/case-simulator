name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: case-opening-simulator

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: case-opening-simulator/package-lock.json
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run generate:pattern-lookups
      - name: Verify generated pattern data is current
        run: git diff --exit-code -- src/data/generated/patternPercentages.generated.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run verify:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: case-opening-simulator/playwright-report/
